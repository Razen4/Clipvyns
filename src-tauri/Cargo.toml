[package]
name = "clipboard-sharings"
version = "0.0.23"
description = "Private cross-platform clipboard history"
authors = ["Clipvyn contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "clipboard_sharings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
hostname = "0.4.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2.4.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
